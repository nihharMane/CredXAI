spring.application.name=credxai-backend

# MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/credxai
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}


# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Server
server.port=8080

# CredXAI ML APIs
credxai.ml.alternative-url=http://127.0.0.1:8001
credxai.ml.traditional-url=http://127.0.0.1:8002