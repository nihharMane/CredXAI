spring.application.name=credxai-backend

# Database credentials are supplied through environment variables.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/credxai}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

# Validate the schema managed by Flyway; do not let Hibernate alter production tables.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

server.port=${PORT:8080}

# Local defaults keep URLs configurable; set hosted URLs in the deployment environment.
credxai.ml.alternative-url=${ML_ALTERNATIVE_URL:http://127.0.0.1:8001}
credxai.ml.traditional-url=${ML_TRADITIONAL_URL:http://127.0.0.1:8002}

# Supply a strong, randomly generated secret (at least 32 bytes) through JWT_SECRET.
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

spring.flyway.enabled=true
# For a fresh database with versioned migrations, prefer a clean migration history.
spring.flyway.baseline-on-migrate=${FLYWAY_BASELINE_ON_MIGRATE:false}

# Keep application logs useful without dumping SQL or secrets.
logging.level.root=INFO
logging.level.CredXAI=${CREDXAI_LOG_LEVEL:INFO}
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN
logging.level.org.flywaydb=INFO
logging.pattern.console=%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%X{correlationId:-}] %logger{36} - %msg%n
